[paths]
input_dir = /data/ETD_rag/markdown
metadata = /data/ETD_rag/metadata.csv
record_manager = /data/ETD_rag/etd_rag.db/record_manager.db
output_dir = /data/ETD_rag/results

[chromadb]
host = localhost
port = 8000
collection = etd_pillars

# Collections the web app (app.py) can search: label = collection name.
[collections]
Theses = etd_pillars
Articles = publications

[embeddings]
model = granite-embedding:30m

[query]
k = 30
fetch_k = 500
