services:

  chromadb:
    image: chromadb/chroma:1.5.7
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      - /data/ETD_rag/etd_rag.db:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes:
      - /data/ETD_rag/volumes/ollama:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
